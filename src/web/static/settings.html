<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <title>Settings — Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/settings.css">
</head>
<body>

    <div id="login-overlay" class="overlay">
        <div class="login-card">
            <div class="login-logo">$</div>
            <h1>Expense Tracker</h1>
            <p class="login-sub">Sign in to manage settings</p>
            <form id="login-form">
                <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit" id="login-btn">Sign In</button>
            </form>
            <p id="login-error" class="error" style="display:none">Invalid password</p>
        </div>
    </div>

    <div id="settings-page" style="display:none">
        <header class="dash-header">
            <div class="header-left">
                <a href="/" class="gear-btn" title="Back to dashboard">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                </a>
                <span class="logo-text">Settings</span>
            </div>
        </header>

        <main class="container">
            <section class="card settings-card">
                <div class="settings-section-header">
                    <h3 class="card-title">Categories</h3>
                    <button class="settings-add-btn" onclick="showAddCategoryModal()">+ Add</button>
                </div>
                <div id="categories-list" class="settings-list"></div>
            </section>

            <section class="card settings-card">
                <div class="settings-section-header">
                    <h3 class="card-title">Learned Merchant Overrides</h3>
                </div>
                <div id="overrides-list" class="settings-list"></div>
                <p id="no-overrides" class="settings-empty" style="display:none">No learned overrides yet. Use /recategorize in Telegram to teach the categorizer.</p>
            </section>
        </main>
    </div>

    <div id="category-modal" class="modal-overlay" style="display:none">
        <div class="modal-card">
            <h3 id="modal-title" class="modal-heading">Add Category</h3>
            <form id="category-form">
                <input type="hidden" id="edit-mode" value="add">
                <div class="form-field">
                    <label for="cat-name">Name</label>
                    <input type="text" id="cat-name" placeholder="e.g. Health" required>
                </div>
                <div class="form-field">
                    <label for="cat-keywords">Keywords (comma-separated)</label>
                    <input type="text" id="cat-keywords" placeholder="e.g. clinic, pharmacy, guardian">
                </div>
                <div class="form-field">
                    <label for="cat-icon">Icon</label>
                    <input type="text" id="cat-icon" placeholder="e.g. &#x1F48A;">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-accent" id="modal-submit">Add</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/settings.js"></script>
</body>
</html>
